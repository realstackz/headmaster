services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: headmaster
      POSTGRES_PASSWORD: headmaster
      POSTGRES_DB: headmaster
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headmaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: headmaster
    volumes:
      - ./lib/db/migrations:/migrations:ro
    command: >
      sh -c "
        psql -h db -U headmaster -d headmaster -f /migrations/0000_colorful_infant_terrible.sql &&
        psql -h db -U headmaster -d headmaster -f /migrations/0001_add_node_sources.sql &&
        psql -h db -U headmaster -d headmaster -f /migrations/0002_add_actions_input_id.sql
      "
    restart: on-failure

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://headmaster:headmaster@db:5432/headmaster
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  headmaster:
    build:
      context: .
      dockerfile: Dockerfile.headmaster
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-server

volumes:
  postgres_data:
